name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # 单个平台失败不影响其他平台出包
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: mipsle
            suffix: linux_mipsle
            goflags: GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=1
            ldflags: "-s -w -linkmode=external -extldflags '-static'"
            # OpenWrt SDK for ramips/mt7620 (MT7620A, mipsel_24kc: little-endian + soft-float)
            # 留空则自动探测该目录下的 SDK；SDK 下载失败会回退到 musl.cc 预编译工具链
            toolchain_url: https://downloads.openwrt.org/releases/23.05.5/targets/ramips/mt7620/openwrt-sdk-23.05.5-ramips-mt7620_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          - os: windows
            arch: amd64
            suffix: windows_amd64
            goflags: GOOS=windows GOARCH=amd64 CGO_ENABLED=1
            ldflags: "-s -w -extldflags '-static'"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    # MT7620A 是 24Kc 无 FPU，必须用 soft-float ABI 的 musl 工具链，
    # OpenWrt SDK 自带的 toolchain 正好是 mipsel_24kc + musl + soft-float。
    - name: Install OpenWrt musl toolchain for MIPSle
      if: matrix.target.arch == 'mipsle'
      run: |
        sudo apt-get update
        sudo apt-get install -y xz-utils

        SDK_URL="${{ matrix.target.toolchain_url }}"
        if [ -z "$SDK_URL" ]; then
          SDK_BASE="https://downloads.openwrt.org/releases/23.05.5/targets/ramips/mt7620"
          SDK_NAME=$(curl -fsSL "$SDK_BASE/" | grep -o 'openwrt-sdk-[^"]*\.tar\.xz' | head -1)
          SDK_URL="$SDK_BASE/$SDK_NAME"
        fi
        echo "SDK URL: $SDK_URL"

        if curl -fsSL --retry 3 -o sdk.tar.xz "$SDK_URL"; then
          tar -xJf sdk.tar.xz
          SDK_DIR=$(realpath $(ls -d openwrt-sdk-* | head -1))
          TOOLCHAIN_BIN=$(find "$SDK_DIR/staging_dir" -name 'mipsel-openwrt-linux-musl-gcc' -printf '%h\n' | head -1)
          TOOLCHAIN_BIN=$(realpath "$TOOLCHAIN_BIN")
          CC_BIN="$TOOLCHAIN_BIN/mipsel-openwrt-linux-musl-gcc"
        else
          echo "::warning::OpenWrt SDK 下载失败，回退 musl.cc 预编译工具链"
          curl -fsSL --retry 3 -o tc.tgz "https://musl.cc/mipsel-linux-musl-cross.tgz"
          sudo tar -xzf tc.tgz -C /opt
          echo "/opt/mipsel-linux-musl-cross/bin" >> "$GITHUB_PATH"
          CC_BIN="/opt/mipsel-linux-musl-cross/bin/mipsel-linux-musl-gcc"
        fi

        echo "CC=$CC_BIN" >> $GITHUB_ENV
        echo "CXX=${CC_BIN%gcc}g++" >> $GITHUB_ENV
        "$CC_BIN" --version

    - name: Install MinGW-w64 for Windows
      if: matrix.target.os == 'windows'
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64
        echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
        echo "CXX=x86_64-w64-mingw32-g++" >> $GITHUB_ENV

    - name: Download dependencies
      run: |
        go clean -modcache
        go mod tidy

    - name: Build for ${{ matrix.target.os }}/${{ matrix.target.arch }}
      run: |
        OUTPUT_FILE="tracepulse_${{ matrix.target.suffix }}${{ matrix.target.os == 'windows' && '.exe' || '' }}"
        ${{ matrix.target.goflags }} go build -tags netgo -ldflags="${{ matrix.target.ldflags }}" -o "$OUTPUT_FILE"
        ls -la tracepulse_*
        file "$OUTPUT_FILE" || true

    - name: Package release
      run: |
        mkdir -p release
        if [ "${{ matrix.target.os }}" = "windows" ]; then
          mv tracepulse_${{ matrix.target.suffix }}.exe release/
        else
          mv tracepulse_${{ matrix.target.suffix }} release/
        fi
        cp README.md release/
        ls -la release/
        tar -czf tracepulse_${{ matrix.target.suffix }}.tar.gz release/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tracepulse_${{ matrix.target.suffix }}
        path: tracepulse_${{ matrix.target.suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create or Update Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-latest"
          echo "使用固定版本tag: $VERSION"

          gh release delete "$VERSION" --yes 2>/dev/null || true

          printf 'Automatic build from commit ${{ github.sha }}\n\n**Platforms:**\n- Linux mipsle (OpenWrt/musl, statically linked)\n- Windows amd64\n\n**使用说明:**\n解压后运行对应平台的可执行文件\n' > notes.md

          gh release create "$VERSION" \
            --title "Development Build (Latest)" \
            --notes-file notes.md \
            --prerelease \
            artifacts/*
