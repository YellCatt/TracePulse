name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # 单个平台失败不影响其他平台出包
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux_amd64
          - goos: linux
            goarch: arm64
            suffix: linux_arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux_armv7
          - goos: windows
            goarch: amd64
            suffix: windows_amd64
          - goos: darwin
            goarch: amd64
            suffix: darwin_amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin_arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    # 项目使用纯 Go 的 SQLite 驱动（glebarez/sqlite -> modernc.org/libc），
    # 因此全程 CGO_ENABLED=0，不需要任何交叉编译工具链即可出静态单文件。
    #
    # 注意：modernc.org/libc 未提供 MIPS 实现，无法构建 linux/mipsle。
    # 若确实需要在 MIPS 架构的 OpenWrt 路由器上运行，需改用 CGO 版驱动
    # （mattn/go-sqlite3 + gorm.io/driver/sqlite）并配合 OpenWrt SDK 工具链。
    - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
      run: |
        BIN="tracepulse_${{ matrix.suffix }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          BIN="${BIN}.exe"
        fi
        go build -trimpath -ldflags "-s -w" -o "$BIN"
        ls -la "$BIN"
        file "$BIN" || true

    - name: Package release
      run: |
        BIN="tracepulse_${{ matrix.suffix }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          BIN="${BIN}.exe"
        fi
        mkdir -p release
        cp "$BIN" release/
        cp README.md release/
        tar -czf "tracepulse_${{ matrix.suffix }}.tar.gz" release/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tracepulse_${{ matrix.suffix }}
        path: tracepulse_${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create or Update Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-latest"
          echo "使用固定版本tag: $VERSION"

          gh release delete "$VERSION" --yes 2>/dev/null || true

          gh release create "$VERSION" \
            --title "Development Build (Latest)" \
            --notes "Automatic build from commit ${{ github.sha }}%0A%0A**Platforms:**%0A- Linux amd64 / arm64 / armv7%0A- Windows amd64%0A- macOS amd64 / arm64%0A%0A**说明:** 纯 Go 静态编译，无需 CGO。%0A**使用:** 解压后直接运行，首次启动会自动生成 config/config.yaml" \
            --prerelease \
            artifacts/*