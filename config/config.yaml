# =============================================================================
# TracePulse 配置文件
#
# 修改后重启生效。
# 注意：只有「配置里缺字段」时程序才会回写本文件补默认值，
#      那时会重排格式并丢掉注释（YAML 序列化的固有限制）。
#      所以字段齐全的情况下，这里的注释可以放心保留。
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP 服务
# -----------------------------------------------------------------------------
server:
    # 监听端口。
    port: 8086
    # 读超时（秒）。防慢客户端长时间占着连接不松手。
    read_timeout_seconds: 30
    # 写超时（秒）。按最慢一个接口的耗时来留余量。
    write_timeout_seconds: 60
    # 优雅关闭等待上限（秒）。要够长，好让内存里的链路落盘。
    shutdown_timeout_seconds: 20

# -----------------------------------------------------------------------------
# 数据库（SQLite）
# -----------------------------------------------------------------------------
database:
    # 数据库文件路径。
    path: ./data.db
    # 遇到写锁时的等待时间（毫秒）。并发写入下必须设置，否则直接报 "database is locked"。
    busy_timeout_ms: 5000
    # 日志模式：
    #   WAL      读写互不阻塞，边上报边查询（默认，推荐）
    #   DELETE   每次事务结束删日志文件，只有一个文件，适合 U 盘
    #   TRUNCATE / PERSIST / MEMORY 一般用不上
    journal_mode: WAL
    # 同步策略：FULL（最安全）/ NORMAL（默认，推荐）/ OFF（掉电会损坏）。
    # 跑在 U 盘、SD 卡上建议 NORMAL，兼顾性能与掉电安全。
    sync_mode: NORMAL

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
log:
    # 日志目录，不存在会自动创建。
    path: ./logs
    # 最低日志级别：debug / info / warn / error。
    # 配了 levels 白名单时，该项失效。
    level: debug
    # 输出模式：
    #   split   按级别分文件，文件之间不重叠（debug.log / info.log / warn.log / error.log）
    #           每个文件只含该级别，fatal 归入 error.log
    #   range   按级别分文件，内容向上叠加：warn.log 里含 warn 及以上
    #   single  所有日志进同一个 app.log，只按级别过滤
    # 只为真正生效的级别建文件：level 是 info 时不会留下空的 debug.log。
    mode: single
    # 级别白名单：非空时只输出列出的级别，优先级高于 level。
    # 例：只想看告警和错误 -> [warn, error]
    # 可和 mode 组合，如 mode: single + levels: [warn, error] = 一个文件里只有告警和错误。
    # 留空（[]）表示不限制，按 level 阈值输出。
    levels: []
    # 关闭控制台输出。容器里日志已经由 stdout 收集时设为 true，避免重复打两份。
    disable_console: false

# -----------------------------------------------------------------------------
# 链路采集与存储
# -----------------------------------------------------------------------------
trace:
    # 事件队列容量。队列满时新事件被丢弃并触发 queue_drop 告警。
    queue_size: 1000
    # 内存中活跃 trace 的最大存活时间（秒）。
    # 超时仍未收到 end 事件则强制落盘，客户端漏发 end 也不会泄漏。
    ttl_seconds: 300
    # 单条 trace 累计多少事件后提前落盘，防止长链路一直驻留内存。
    flush_batch: 200
    # 批量落盘的时间窗口（毫秒）。
    flush_ms: 200
    # 过期链路保留天数，后台定时清理。
    cleanup_days: 7
    # 清理任务执行间隔（分钟）。
    cleanup_interval_minutes: 60
    # 关闭磁盘空间回收（VACUUM）。默认 false 即开启回收，避免文件只增不减。
    disable_vacuum: false
    # 兜底日志路径：trace-server 不可用时事件仍会落盘。
    # 留空则输出到 stdout（容器友好，交给 Docker log driver 收集）。
    ndjson_path: ""
    # 兜底日志单文件上限（MB），超过后轮转，保留一个历史文件。
    ndjson_max_mb: 64
    # 单条链路最多保留多少事件，超出部分丢弃，防止单条异常链路撑爆磁盘。
    max_events_per_trace: 5000
    # 上报接口请求体上限（字节），防止超大 payload 打爆内存。默认 8MB。
    report_max_body_bytes: 8388608

# -----------------------------------------------------------------------------
# 邮件告警
# -----------------------------------------------------------------------------
alert:
    # 总开关。设为 false 时下面全部配置不生效。
    enabled: false

    # --- SMTP ---
    smtp_host: ""
    # 465 一般用隐式 TLS，587 一般用 STARTTLS，填错端口会卡在握手超时上。
    smtp_port: 587
    smtp_user: ""
    smtp_password: ""
    # 发件人地址。留空则自动取 smtp_user。
    smtp_from: ""
    # 隐式 TLS（通常配 465）。端口填 465 时会自动开启。
    use_tls: false
    # 显式 STARTTLS（通常配 587）。
    starttls: false
    # 跳过证书校验。仅建议内网自签证书场景使用，公网千万别开。
    insecure_skip_verify: false

    # --- 收件与触发 ---
    recipients:
        - admin@example.com
    # 触发告警的条件，可选：error / warn / timeout / queue_drop / slow
    #   error       链路中出现错误事件
    #   warn        链路中出现告警事件
    #   timeout     链路超时未收到 end 事件
    #   queue_drop  事件队列已满导致丢弃
    #   slow        链路耗时超过 slow_threshold_ms
    triggers:
        - error
        - warn
        - timeout
        - queue_drop
    # 慢调用阈值（毫秒）。triggers 里含 slow 时才生效，0 表示关闭慢调用告警。
    slow_threshold_ms: 0
    # 告警邮件里「查看详情」链接的 base URL，要填成外部能访问的地址。
    public_url: http://localhost:8086

    # --- 限流与去重 ---
    # 单次发信超时（秒）。
    timeout_seconds: 15
    # 同一 trace_id + 状态在该窗口内（秒）只告警一次，避免重复邮件轰炸。
    # 显式设为 0 表示关闭去重。
    dedup_seconds: 300
    # 全局告警最小发送间隔（秒），令牌桶限流。防止故障风暴时邮件炸群。
    min_interval_seconds: 60
    # 邮件正文中最多附带的事件条数。
    max_events_in_mail: 500
    # 告警队列容量。队列满时直接丢弃告警——宁可丢告警也不能拖垮采集。
    queue_size: 256

# -----------------------------------------------------------------------------
# 内置演示数据
# -----------------------------------------------------------------------------
demo:
    # 关闭启动时的演示数据写入。正式部署建议设为 true。
    disable: false
    # 即使库里已有链路也再灌一批，用于反复演示。
    # 演示数据的 trace_id 带启动时间戳，不会撞上 traces.trace_id 的唯一索引。
    force: false